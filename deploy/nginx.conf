# Sample nginx server block for Noor.
#
# xCloud, Ploi, RunCloud and similar panels let you paste rules like these into
# the site's custom nginx configuration.
#
# ---------------------------------------------------------------------------
# Option A (recommended) — point the site's web root at the public/ directory.
# ---------------------------------------------------------------------------
#
# In the xCloud site settings, set the web root to  /public  and nothing below
# is needed beyond the standard PHP location block:
#
#     root /home/<user>/htdocs/<site>/public;
#     index index.php;
#
#     location / {
#         try_files $uri $uri/ /index.php?$query_string;
#     }
#
# That try_files line is what makes the clean URLs work: /quran/al-baqarah is
# not a file on disk, so it has to fall through to the front controller.
#
# ---------------------------------------------------------------------------
# Option B — the web root stays at the repository root.
# ---------------------------------------------------------------------------
#
# The root index.php bootstrap handles this, but add these rules so assets
# resolve cleanly and the application directories stay private.

server {
    # root /home/<user>/htdocs/<site>;
    index index.php;

    # Static assets live under public/assets.
    location /assets/ {
        try_files /public$uri =404;
        access_log off;
        expires 7d;
    }

    # Never serve the application internals.
    location ~ ^/(config|src|views|storage|deploy)/ {
        deny all;
        return 404;
    }

    location ~ /\.(git|env|htaccess) {
        deny all;
        return 404;
    }

    # Everything else goes to the front controller.
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        # Match this to the PHP version the site runs.
        fastcgi_pass unix:/var/run/php/php8.2-fpm.sock;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
